<!DOCTYPE html>
<html>
<head>
  <title>Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

  <h1 class="text-2xl font-bold text-center">Submit Form</h1>

  <form action="/form" method="POST" class="max-w-md mx-auto mt-5 bg-white p-5 rounded shadow">

    <input 
      type="text" 
      name="name" 
      placeholder="Name" 
      class="w-full p-2 border mb-3" 
      required
    >

    <input 
      type="email" 
      name="email" 
      placeholder="Email" 
      class="w-full p-2 border mb-3" 
      required
    >

    <button 
      type="submit" 
      class="bg-blue-500 text-white px-4 py-2 rounded w-full">
      Submit
    </button>

  </form>

</body>
</html>
